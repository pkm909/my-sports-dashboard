<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Personal sports dashboard for the Boston Red Sox, San Francisco Giants, San Francisco 49ers, San Jose Sharks and San Jose Earthquakes.">
  <title>My Sports Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">MY TEAMS</div>
      <h1>Sports Dashboard</h1>
      <p id="status">Loading current standings…</p>
    </div>
    <button id="refresh" class="refresh" type="button" aria-label="Refresh sports data">↻ Refresh</button>
  </header>

  <main id="dashboard" class="dashboard" aria-live="polite"></main>

  <footer>
    <span>Data powered by ESPN's public web endpoints.</span>
    <span id="updated"></span>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
